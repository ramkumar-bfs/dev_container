services:
  app:
    hostname: dev-container # Set a custom hostname for the container
    user: "pipeline" # Run as the non-root user
    volumes:
      - "${HOST_APPS}:/apps" # Host apps mount
      - "${HOST_TOOLS}:/tools" # Host tools mount
      - "${HOST_PROJECTS}:/projects" # Host projects mount
      - "${DEVELOPMENT}:/home/pipeline/development" # Host development mount
    working_dir: /home/pipeline # Default folder on container start
    command: ["/bin/bash"] # Interactive shell
